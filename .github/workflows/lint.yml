name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker compose build dev

      - name: Format check
        run: docker compose run --rm dev cargo fmt --all -- --check

      - name: Clippy
        run: docker compose run --rm dev cargo clippy --all-targets --all-features -- -D warnings
