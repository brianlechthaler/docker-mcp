[package]
name = "docker-mcp"
version = "0.1.0"
edition = "2021"
description = "Secure MCP server for Docker operations"
license = "MIT"
readme = "README.md"
repository = "https://github.com/brianlechthaler/docker-mcp"
keywords = ["mcp", "docker", "model-context-protocol"]
categories = ["command-line-utilities"]

[[bin]]
name = "docker-mcp"
path = "src/main.rs"

[lib]
name = "docker_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bollard = "0.18"
futures-util = "0.3"
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
